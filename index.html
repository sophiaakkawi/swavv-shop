<script>
        const PRODUCTS = [
            { id: 'swv-01', name: 'Cyberpunk Cyber-Hoodie v1.0', price: 125.00, img: 'https://unsplash.com' },
            { id: 'swv-02', name: 'Phantom Oversized Cargo Tech-Pants', price: 140.00, img: 'https://unsplash.com' },
            { id: 'swv-03', name: 'SWAVV Signature Heavyweight Tee', price: 65.00, img: 'https://unsplash.com' },
            { id: 'swv-04', name: 'Neon Matrix Structured Beanie', price: 35.00, img: 'https://unsplash.com' }
        ];

        let cart = [];

        function initStore() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = PRODUCTS.map(p => `
                <div class="bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden flex flex-col justify-between group">
                    <div class="h-48 bg-neutral-800 relative overflow-hidden flex items-center justify-center text-neutral-600 font-mono text-xs">
                        [ PRODUCT IMAGE ]
                    </div>
                    <div class="p-5 flex flex-col flex-grow justify-between">
                        <div>
                            <h3 class="font-bold text-white mb-1 group-hover:text-[#00ffcc] transition-colors">${p.name}</h3>
                            <p class="text-neutral-400 font-mono text-sm mb-4">$${p.price.toFixed(2)}</p>
                        </div>
                        <button onclick="addToCart('${p.id}')" class="w-full bg-neutral-950 border border-neutral-700 hover:border-[#00ffcc] text-white font-bold py-2.5 rounded-xl transition-all cursor-pointer text-xs uppercase tracking-wider">
                            Add to Bag
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function toggleCart() {
            const drawer = document.getElementById('cart-drawer');
            const panel = document.getElementById('cart-panel');
            drawer.classList.toggle('opacity-0');
            drawer.classList.toggle('invisible');
            panel.classList.toggle('translate-x-full');
        }

        function addToCart(id) {
            const product = PRODUCTS.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCartUI();
            toggleCart();
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        function updateCartUI() {
            const countEl = document.getElementById('cart-count');
            const titleEl = document.getElementById('cart-items-title');
            const container = document.getElementById('cart-items-container');
            const totalEl = document.getElementById('cart-total');

            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            if (totalItems > 0) {
                countEl.classList.remove('hidden');
                countEl.textContent = totalItems;
            } else {
                countEl.classList.add('hidden');
            }

            titleEl.textContent = `(${totalItems} items)`;
            totalEl.textContent = `$${totalPrice.toFixed(2)}`;

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-xs text-neutral-500 text-center py-8">Your bag is empty.</p>`;
                return;
            }

            container.innerHTML = cart.map(item => `
                <div class="flex items-center justify-between bg-neutral-950 p-3 rounded-xl border border-neutral-800">
                    <div>
                        <h5 class="text-xs font-bold text-white">${item.name}</h5>
                        <p class="text-[11px] text-neutral-400">$${item.price.toFixed(2)} x ${item.qty}</p>
                    </div>
                    <button type="button" onclick="removeFromCart('${item.id}')" class="text-neutral-500 hover:text-red-400 p-1 cursor-pointer">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            `).join('');

            lucide.createIcons();
        }

        async function handleCheckout(event) {
            event.preventDefault();

            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }

            const btn = document.getElementById('submit-order-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');

            btn.disabled = true;
            btnText.classList.add('hidden');
            btnSpinner.classList.remove('hidden');

            // Format items summary string
            const itemsSummary = cart.map(item => `${item.name} (x${item.qty})`).join(', ');
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            // Pull values directly from the correct input IDs matching your form
            const orderData = {
                orderNumber: "SWV-" + Math.floor(100000 + Math.random() * 900000),
                customerName: document.getElementById('customer-name').value,
                email: document.getElementById('customer-email').value,
                phone: document.getElementById('customer-phone').value,
                address: document.getElementById('customer-address').value,
                items: itemsSummary,
                total: "$" + totalPrice.toFixed(2)
            };

            try {
                await fetch('https://script.google.com/macros/s/AKfycbzhRi_GyK1v46QcZrRo1bVpBUBE6p1Deqa1M_xqG8bGcJEgVilpeTPWpKx8yusnNVhU/exec', {
                    method: 'POST',
                    mode: 'no-cors', // Prevents CORS errors with Google Apps Script
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                alert('Order placed successfully! Cash on delivery confirmed.');
                cart = [];
                updateCartUI();
                document.getElementById('cod-checkout-form').reset();
                toggleCart();
            } catch (error) {
                console.error('Error submitting order:', error);
                alert('Something went wrong. Please try again.');
            } finally {
                btn.disabled = false;
                btnText.classList.remove('hidden');
                btnSpinner.classList.add('hidden');
            }
        }

        initStore();
        lucide.createIcons();
    </script>
            const grid = document.getElementById('product-grid');
